name: CI

on:
  push:
  pull_request:

jobs:
  codex-runtime:
    name: Codex runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify the bundled platform runtime without PATH
        run: node --test test/codex-command.test.mjs test/app-server-client.test.mjs test/connection-status.test.mjs test/bundled-runtime-contract.test.mjs

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Check out official DSH
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317 # dsh-v0.2.1-rc.2
          path: upstream/deepseek-harness
      - run: pnpm install --ignore-scripts --frozen-lockfile
        working-directory: upstream/deepseek-harness
      - name: Build official DSH packages
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['build:native-system'] ? 0 : 1)"; then
            pnpm run build:native-system
          fi
          pnpm run build:lib
        working-directory: upstream/deepseek-harness
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run verify
        env:
          DSH_ROOT: ${{ github.workspace }}/upstream/deepseek-harness
      - run: git diff --exit-code -- lib
      - run: npm pack --dry-run
