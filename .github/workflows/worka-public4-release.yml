name: Publish Worka public Codex compatibility .4

on:
  push:
    branches:
      - release/worka-public.4

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.repository == 'kllilizxc/relay-dsh-plugin-codex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: upstream/deepseek-harness
          persist-credentials: false
      - run: pnpm install --ignore-scripts --frozen-lockfile
        working-directory: upstream/deepseek-harness
      - name: Build official DSH peer packages
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['build:native-system'] ? 0 : 1)"; then pnpm run build:native-system; fi
          pnpm run build:lib
        working-directory: upstream/deepseek-harness
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Typecheck, focused unit tests, build and pack check
        run: npm run verify
        env:
          DSH_ROOT: ${{ github.workspace }}/upstream/deepseek-harness
      - name: Ensure committed source and compiled bundle agree
        run: |
          git diff --exit-code -- lib
          npm pack --dry-run --ignore-scripts
      - name: Pack immutable public compatibility archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.5-rc.1-worka-public.4"
          node -e "const p=require('./package.json');if(p.version!=='0.2.5-rc.1-worka-public.4')process.exit(1)"
          mkdir -p dist-release
          npm pack --ignore-scripts --pack-destination dist-release --json > dist-release/pack.json
          package="$(node -e "console.log(require('./dist-release/pack.json')[0].filename)")"
          test -f "dist-release/$package"
          sha="$(sha256sum "dist-release/$package" | cut -d' ' -f1)"
          sha512="$(openssl dgst -sha512 -binary "dist-release/$package" | openssl base64 -A)"
          mv "dist-release/$package" "dist-release/$sha.tgz"
          printf '%s  %s\n' "$sha" "$sha.tgz" > dist-release/SHA256SUMS.txt
          {
            printf 'Worka public compatibility release %s\n' "$version"
            printf 'Source repository: %s\n' "$GITHUB_REPOSITORY"
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Base: %s\n' "0.2.5-rc.1-worka-public.3"
            printf 'DSH peer: 0.2.1-rc.2\n'
            printf 'Codex CLI: 0.166.0\n'
            printf 'SHA-256: %s\n' "$sha"
            printf 'npm integrity: sha512-%s\n' "$sha512"
            printf 'Build: npm ci --ignore-scripts --legacy-peer-deps; npm run verify; npm pack --ignore-scripts\n'
          } > dist-release/PROVENANCE.md
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "integrity=sha512-$sha512" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256=$sha" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA512_INTEGRITY=sha512-$sha512" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the exact immutable archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.5-rc.1-worka-public.4"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace an existing release: $tag" >&2
            exit 1
          fi
          sha="${{ steps.pack.outputs.sha256 }}"
          gh release create "$tag" "dist-release/$sha.tgz" dist-release/SHA256SUMS.txt dist-release/PROVENANCE.md \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file dist-release/PROVENANCE.md \
            --latest=false
